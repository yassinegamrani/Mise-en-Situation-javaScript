    <!-- Police Google Fonts : Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      </div>
      <form id="formPage">
        <select name="countries" id="">
          <option value="">Afrique</option>
          <option value="">Europe</option>
          <option value="">Asie</option>
          <option value="">Amerique</option>
        </select>
        <label for="">Rechercher un pays</label>
        <input id="searchInput" type="text">
        <button id="" style="background-color: #0f4c81;"><i class="fa-solid fa-up-down"></i>Trier par population</button>
      </form>
